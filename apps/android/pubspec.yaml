name: quizsync_android
description: "QuizSync AI — Android 端（悬浮球截屏、上传分析、本地历史）。"
publish_to: 'none'
# 1.0.0 = 正式版（M18 第 1 条）。M46 第 4 条：双端统一到 1.1.0。
# `+N` 只是内部出包序号：Android 用它生成 versionCode（1000+N / 2000+N / 4000+N），
# 保证新包能覆盖安装；界面上不显示。
version: 1.1.0+22

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.20.0
  quizsync_core:
    path: ../../packages/quizsync_core
  quizsync_ui:
    path: ../../packages/quizsync_ui
  flutter_riverpod: ^2.5.1
  mobile_scanner: ^5.2.3
  image_picker: ^1.1.2
  flutter_secure_storage: ^9.2.0
  path_provider: ^2.1.4
  image: ^4.2.0
  sqlite3_flutter_libs: ^0.5.24

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
