name: quizsync_server
description: "QuizSyncAI Server — 功能冻结的 Windows 后台服务：全局热键截屏 → AI 识别 → 通过既有协议把结果推给 Android。纯 Dart CLI，不依赖 Flutter/Desktop。"
publish_to: 'none'

# 独立版本线：Server 冻结在 1.0.x（补丁位可动），不跟随主项目（见 README）。
version: 1.0.1

environment:
  sdk: ^3.13.0

dependencies:
  # 与 quizsync_core 完全相同的协议/AI 依赖（只取最小子集）
  crypto: ^3.0.0
  image: ^4.2.0
  dio: ^5.4.0
  shelf: ^1.4.0
  shelf_router: ^1.1.0
  shelf_web_socket: ^3.0.0
  shelf_multipart: ^2.0.0
  web_socket_channel: ^3.0.0
  # Windows 原生：全局热键 + GDI 截屏
  win32: ^5.5.0
  ffi: ^2.1.0
  # 终端里的配对二维码（纯 Dart）
  qr: ^3.0.2
  path: ^1.9.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
